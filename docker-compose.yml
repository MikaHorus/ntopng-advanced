services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ntopng-advanced-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_NAME: ${APP_NAME:-ntopng-history-viewer}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      API_V1_PREFIX: ${API_V1_PREFIX:-/api/v1}
      NTOPNG_BASE_URL: ${NTOPNG_BASE_URL:?NTOPNG_BASE_URL must be set in .env}
      NTOPNG_USERNAME: ${NTOPNG_USERNAME:-}
      NTOPNG_PASSWORD: ${NTOPNG_PASSWORD:-}
      NTOPNG_API_KEY: ${NTOPNG_API_KEY:?NTOPNG_API_KEY must be set in .env}
      NTOPNG_VERIFY_SSL: ${NTOPNG_VERIFY_SSL:-false}
      NTOPNG_INTERFACE_ID: ${NTOPNG_INTERFACE_ID:-}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://ntopng:ntopng@postgres:5432/ntopng}
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-60}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ntopng-advanced-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "85:80"

  postgres:
    image: postgres:16-alpine
    container_name: ntopng-advanced-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ntopng}
      POSTGRES_USER: ${POSTGRES_USER:-ntopng}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ntopng}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
